; PlatformIO project for GoKart ESP32 firmware (mock-sensor devkit mode).

[platformio]
default_envs = esp32s3_mock

[env:esp32s3_mock]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
build_flags =
    -DCONFIG_GOKART_MOCK_SENSORS=1
    -I../core_c/include
build_src_filter =
    +<../core_c/src/*.c>
    +<src/*.c>
    -<src/idf_component.yml>

[env:esp32_mock]
platform = espressif32
board = esp32dev
framework = espidf
monitor_speed = 115200
build_flags =
    -DCONFIG_GOKART_MOCK_SENSORS=1
    -I../core_c/include
build_src_filter =
    +<../core_c/src/*.c>
    +<src/*.c>
    -<src/idf_component.yml>
