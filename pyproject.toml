[project]
name = "gokart"
version = "0.1.0"
description = "Configuration-driven electric go-kart simulation and control platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "numpy",
    "fastapi",
    "uvicorn[standard]",
    "websockets",
    "matplotlib",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
    "httpx>=0.27",
    "cantools",
    "python-can",
]

[project.scripts]
gokart = "gokart.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gokart"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
